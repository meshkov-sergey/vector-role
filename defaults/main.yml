# defaults file for vector-role
---
vector_version: "0.34.1"
vector_install_dir: "/opt/vector"
vector_config_dir: "/etc/vector"
vector_data_dir: "/var/lib/vector"

# Адрес ClickHouse. Берем из инвентаря, но можно переопределить в плейбуке.
clickhouse_host: "{{ hostvars[groups['clickhouse'][0]]['ansible_host'] | default('clickhouse-01') }}"
